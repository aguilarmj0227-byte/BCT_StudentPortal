
name: Build BCT_StudentPortal iOS Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build BCT_StudentPortal iOS Archive
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      # 4. Verify environment
      - name: Verify tools
        run: |
          python --version
          flutter --version
          xcodebuild -version

      # 5. Install Flet
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.0.5" "flet-cli==1.0.5"

      # 6. Verify Flet
      - name: Verify Flet installation
        run: |
          flet --version
          python -m pip show flet
          python -m pip show flet-cli

      # 7. Install additional Python dependencies
      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 8. Verify device_info_plus override
      - name: Check dependency configuration
        run: |
          echo "Checking pyproject.toml..."
          grep -A 3 "dependency_overrides" pyproject.toml

      # 9. Clean previous build
      - name: Clean previous build
        run: |
          rm -rf build

      # 10. Build iOS archive
      - name: Build iOS Archive
        run: |
          flet build ipa --verbose

      # 11. Verify resolved dependency
      - name: Verify device_info_plus version
        run: |
          if [ -f build/flutter/pubspec.lock ]; then
            grep -A 4 "device_info_plus:" build/flutter/pubspec.lock
          else
            echo "pubspec.lock not found"
          fi

      # 12. Find build output
      - name: Find iOS build output
        run: |
          echo "Searching for XCArchive..."
          find build -type d -name "*.xcarchive" -print

          echo "Searching for IPA..."
          find build -type f -name "*.ipa" -print

      # 13. Upload iOS archive and IPA
      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: BCT_StudentPortal-iOS-Archive
          path: |
            build/**/*.xcarchive
            build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
