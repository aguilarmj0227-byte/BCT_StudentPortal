
name: Build BCT_StudentPortal iOS Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build BCT_StudentPortal iOS Archive
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"

      - name: Verify Flutter
        run: |
          flutter --version
          echo "Checking Flutter version..."
          flutter doctor -v

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.0.5" "flet-cli==1.0.5"

      - name: Verify Flet and Flutter compatibility
        run: |
          flet --version
          python -c "import flet.version; print('Required Flutter:', flet.version.flutter_version)"
          flutter --version

      - name: Build iOS IPA
        run: |
          flet build ipa --verbose

      - name: Find iOS build output
        run: |
          echo "Searching for iOS archive..."
          find build -type d -name "*.xcarchive" -print || true

          echo "Searching for IPA..."
          find build -type f -name "*.ipa" -print || true

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: BCT_StudentPortal-iOS-Archive
          path: |
            build/**/*.xcarchive
            build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
