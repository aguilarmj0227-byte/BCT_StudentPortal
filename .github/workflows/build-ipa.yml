name: Build BCT_StudentPortal iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build BCT_StudentPortal IPA
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Verify environment
        run: |
          python --version
          flutter --version
          xcodebuild -version

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.0.5" "flet-cli==1.0.5"

      - name: Verify Flet
        run: |
          flet --version
          pip show flet
          pip show flet-cli

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify dependency overrides
        run: |
          echo "Checking pyproject.toml..."
          grep -A 5 "dependency_overrides" pyproject.toml || true

      - name: Clean previous build
        run: |
          rm -rf build

      - name: Build iOS IPA
        run: |
          flet build ipa --verbose

      - name: Verify resolved Flutter dependencies
        run: |
          echo "Checking device_info_plus..."
          grep -A 3 "device_info_plus:" build/flutter/pubspec.lock || true

          echo "Checking connectivity_plus..."
          grep -A 3 "connectivity_plus:" build/flutter/pubspec.lock || true

      - name: Find and verify IPA
        run: |
          echo "Searching for IPA..."

          find build -type f -name "*.ipa" -print

          IPA_COUNT=$(find build -type f -name "*.ipa" | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA file was generated."
            exit 1
          fi

          echo "Successfully generated IPA file."

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: BCT_StudentPortal-iOS-IPA
          path: build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
