
name: Build BCT_StudentPortal iOS Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build BCT_StudentPortal iOS Archive
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Verify environment
        run: |
          python --version
          flutter --version
          xcodebuild -version

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.0.5" "flet-cli==1.0.5"

      - name: Verify Flet
        run: |
          flet --version
          pip show flet
          pip show flet-cli

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify dependency overrides
        run: |
          echo "Checking pyproject.toml..."
          grep -A 5 "dependency_overrides" pyproject.toml

      - name: Clean previous build
        run: |
          rm -rf build

      - name: Build iOS Archive
        run: |
          flet build ipa --verbose

      - name: Verify resolved Flutter dependencies
        run: |
          echo "Checking device_info_plus..."
          grep -A 3 "device_info_plus:" build/flutter/pubspec.lock

          echo "Checking connectivity_plus..."
          grep -A 3 "connectivity_plus:" build/flutter/pubspec.lock

      - name: Find iOS build output
        run: |
          echo "Searching for XCArchive..."
          find build -type d -name "*.xcarchive" -print

          echo "Searching for IPA..."
          find build -type f -name "*.ipa" -print

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: BCT_StudentPortal-iOS-Archive
          path: |
            build/**/*.xcarchive
            build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
