
name: Build BCT_StudentPortal iOS Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flet
        run: pip install "flet==1.0.5" "flet-cli==1.0.5"

      - name: Verify tools
        run: |
          python --version
          flutter --version
          flet --version

      - name: Build unsigned iOS archive
        run: |
          flet build ipa --verbose

      - name: Find iOS build output
        run: |
          find build -type d -name "*.xcarchive" -print
          find build -type f -name "*.ipa" -print

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: BCT_StudentPortal-iOS-Archive
          path: build/**/*.xcarchive
          if-no-files-found: error
          retention-days: 7
